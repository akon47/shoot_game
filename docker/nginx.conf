# nginx inside the shoot-game-web container. TLS and the public hostname are handled by the gateway
# (nginx LXC 101 behind Cloudflare), which proxies shootgame.kimhwan.kr -> this container's port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Log the real visitor, not the gateway (it sets X-Real-IP).
    set_real_ip_from 10.10.10.0/24;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The entry page carries the build id (?v=...) for every script, so it must never be served stale.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Scripts and styles are versioned by ?v=<build>; keep a short TTL as a safety net.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Sprites, sounds, favicons: large and rarely changed.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|mp3|wav|ogg|json|xml)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
